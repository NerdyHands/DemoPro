name: Client CI

on:
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/client-ci.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'client/**'
      - '.github/workflows/client-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./client
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint
        continue-on-error: true
      
      - name: Build
        run: npm run build:ci
        env:
          NODE_ENV: production
          # Set required REACT_APP_ environment variables
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL || 'https://picra-server-187337178119.us-east4.run.app' }}
          REACT_APP_ENVIRONMENT: production
          REACT_APP_GOOGLE_CLIENT_ID: ${{ secrets.REACT_APP_GOOGLE_CLIENT_ID || '' }}
          REACT_APP_GOOGLE_PLACES_API_KEY: ${{ secrets.REACT_APP_GOOGLE_PLACES_API_KEY || '' }}
          REACT_APP_ANALYTICS_ENABLED: 'false'
          REACT_APP_ENABLE_DEBUG: 'false'
          REACT_APP_USE_FAKE_DATA: 'false'
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: matrix.node-version == '20.x'
        with:
          name: client-build
          path: client/build
          retention-days: 7
