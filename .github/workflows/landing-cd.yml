name: Landing CD

on:
  push:
    branches:
      - main
    paths:
      - 'landing/**'
      - '.github/workflows/landing-cd.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      url: ${{ steps.deploy.outputs.url }}
    
    defaults:
      run:
        working-directory: ./landing
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: landing/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          VITE_S3_BLOG_DATA_BASE: ${{ secrets.VITE_S3_BLOG_DATA_BASE }}
          VITE_USE_STATIC_BLOG_DATA: ${{ secrets.VITE_USE_STATIC_BLOG_DATA || 'true' }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || '' }}
          VITE_GA_ID: ${{ secrets.VITE_GA_ID || '' }}
      
      - name: Deploy to Vercel (Optional)
        id: deploy
        if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./landing
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: landing-dist
          path: landing/dist
          retention-days: 30
      
      - name: Comment deployment info
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Landing page build completed successfully!'
            })
