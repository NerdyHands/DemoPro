version: 1
frontend:
  phases:
    preBuild:
      commands:
        - node -v
        - nvm use 20 || true
        - npm ci
    build:
      commands:
        - env | grep -E '^(ADMIN_SESSION_SECRET|AIRTABLE_|RESEND_|NEXT_PUBLIC_|N8N_)' >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
