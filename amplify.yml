version: 1
applications:
  - appRoot: landing
    frontend:
      phases:
        preBuild:
          commands:
            # @opinly/* requires Node >= 20.19 — set Amplify build image Node to 20.x
            - node -v
            - npm ci --legacy-peer-deps
            - npx playwright install chromium
        build:
          commands:
            # Requires Amplify env: OPINLY_API_KEY, OPINLY_CDN_NAMESPACE (or OPINLY_IMAGES_PREFIX), VITE_SITE_URL
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .npm/**/*
  - appRoot: work
    frontend:
      phases:
        preBuild:
          commands:
            - node -v
            - nvm use 20 || true
            - npm ci
        build:
          commands:
            # Amplify console env is build-only unless written here for Next.js SSR
            - env | grep -E '^(ADMIN_SESSION_SECRET|AIRTABLE_|RESEND_|NEXT_PUBLIC_|N8N_)' >> .env.production || true
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
