version: 1
applications:
  - appRoot: landing
    frontend:
      phases:
        preBuild:
          commands:
            # @opinly/* requires Node >= 20.19 — set Amplify build image Node to 20.x
            - node -v
            - npm ci --legacy-peer-deps
            - npx playwright install chromium
        build:
          commands:
            # Requires Amplify env: OPINLY_API_KEY, OPINLY_CDN_NAMESPACE (or OPINLY_IMAGES_PREFIX), VITE_SITE_URL
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .npm/**/*
