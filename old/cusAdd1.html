<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        /* CSS styles for the map container */

        .Geolocation {
            background: #ecf0f1;
        }

        .gm-style .gm-style-iw {
            text-align: center;
            color: #101010;
            font-weight: bold;
            font-size: 13px;
            overflow: hidden;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(215, 18, 18, 0.1);
            border: 1px solid #dddddd;
            transition: all 0.3s ease;

        }

        .gm-style .gm-style-iw:hover {
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }


        gm-style .gm-style-iw-t {
            position: absolute;
            width: 100%;
        }

        .gm-style {
            font: 400 11px Roboto, Arial, sans-serif;
            text-decoration: none;
        }

        /* CSS styles for the map container */

        .Geolocation {
            background: #ecf0f1;
        }

        #map {
            border-radius: 2px;
            height: 400px;
            width: 100%;

        }
    </style>
    <!-- Include the Google Maps API -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBWC2cvayYCEPFfpZMBJEk7jL3V9PViO0k&callback=initMap"
        async defer></script>
</head>

<body>
    <!-- Display the map here -->
    <div id="map"></div>

    <script>
        // JavaScript logic
        let map;
        let geocoder;

        function initMap() {
            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 20,
                center: { lat: 0, lng: 0 },// Default center
                mapTypeControl: false,
                mapTypeId: 'hybrid',
                gestureHandling: 'none',// Disable all gestures (panning and zooming)
                draggable: false, // Disable dragging the map
                scrollwheel: false, // Disable scrolling to zoom
                keyboardShortcuts: false, // Disable keyboard shortcuts
                disableDoubleClickZoom: true // Disable double click zoom
            });
            geocoder = new google.maps.Geocoder();
            const address = getParameterByName('address');

            if (address) {
                geocodeAddress(address);
            }
        }

        function geocodeAddress(address) {
            geocoder.geocode({ 'address': address }, function (results, status) {
                if (status === 'OK') {
                    const location = results[0].geometry.location;
                    map.setCenter(location);
                    const marker = new google.maps.Marker({
                        map: map,
                        position: location
                    });

                    // Create and open the InfoWindow with the address
                    const infowindow = new google.maps.InfoWindow({
                        content: address
                    });
                    infowindow.open(map, marker);
                } else {
                    alert('Geocode was not successful for the following reason: ' + status);
                }
            });
        }

        // Function to get parameter from URL
        function getParameterByName(name) {
            name = name.replace(/[\[\]]/g, "\\$&");
            var regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)"),
                results = regex.exec(window.location.href);
            if (!results) return null;
            if (!results[2]) return '';
            return decodeURIComponent(results[2].replace(/\+/g, " "));
        }
    </script>
</body>

</html>
