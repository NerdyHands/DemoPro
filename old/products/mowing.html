	<div id="portfolio_all-container"></div>

    <!-- Modal Part End -->




<!--  -->
	<script>
		document.addEventListener("DOMContentLoaded", function() {
    // Get the modal trigger element
    var modalTrigger = document.querySelector('.bs4_modal_trigger');
    
    // Get the modal element
    var modal = document.getElementById('bs4_prtflo');

    // Get the close button
    var closeButton = modal.querySelector('.bs4_btn_x_out_shtr');

    // Function to open the modal
    function openModal(event) {
        event.preventDefault();
        modal.style.display = 'block';
    }

    // Function to close the modal
    function closeModal(event) {
        event.preventDefault();
        modal.style.display = 'none';
    }

    // Event listeners
    modalTrigger.addEventListener('click', openModal);
    closeButton.addEventListener('click', closeModal);
});
	</script>





	<!-- jQuery -->
	<script src="modal/js/jquery.js"></script>

	<script src="modal/js/bootstrap.min.js"></script>

</body>
