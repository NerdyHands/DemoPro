<script>
        // Initialize the Google Places Autocomplete service
        function initAutocomplete() {
            var input = document.getElementById('address');
            var autocomplete = new google.maps.places.Autocomplete(input);

            autocomplete.addListener('place_changed', function() {
                var place = autocomplete.getPlace();

                if (!place.geometry) {
                    window.alert("Autocomplete's returned place contains no geometry");
                    return;
                }
                
                console.log(place); // You can use the place object as needed
            });
        }
    </script>

    <!-- Load the Places Autocomplete after the page has finished loading -->
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCeJIf1JlDn4tI8EJHVOPJ8m86QV-4TSGQ&libraries=places&callback=initAutocomplete" type="text/javascript"></script>

    <script>
            // Get the modal
      var modal = document.getElementById("myPopUp");

      // Get the button that opens the modal
      var btn = document.getElementById("myBtn");

      // Get the <span> element that closes the modal
      var span = document.getElementsByClassName("close")[0];

      // When the user clicks on the button, open the modal
      btn.onclick = function() {
        modal.style.display = "block";
      }

      // When the user clicks on <span> (x), close the modal
      span.onclick = function() {
        modal.style.display = "none";
      }

      // When the user clicks anywhere outside of the modal, close it
      window.onclick = function(event) {
        if (event.target == modal) {
          modal.style.display = "none";
        }
      }

    </script>
