<body>


    <section class="container">

        <form id="snippet-form" class="snippet-form-align-left plugin-form form_snippet-form" method="post"
            autocomplete="off" name="google-sheet" action="">

            <!-- Header -->
            <p id="snippet-title" class="form_snippet-title">Get an instant online estimate</p>

            <!-- client -->
            <div class="snippet-group" style="display: block;">
                <p class="form_snippet-group" id="personal-details-id">
                    Personal Details: <small id="personal-details-asteric-id" class="form_personal-details-asteric-id">
                        <sup class="form_color_red">*</sup>
                    </small>
                </p>

                <div class="snippet-row" style="display: flex;">
                    <label for="snippet-full-name" style="display: block;">
                        <input class="form_snippet-row-input" type="text" id="snippet-full-name" name="name"
                            placeholder="Full Name" autocomplete="on" required />
                        <small id="form-name-error-text-id" class="snippet-error" style="color: red; display: none;">
                            Required
                        </small>
                    </label>

                    <label for="snippet-email" style="display: block;">
                        <input type="text" id="snippet-email" class="form_snippet-row-input" name="email" placeholder="Email" autocomplete="on"
                            required  />

                    </label>
                </div>
            </div>

            <p id="address-details-id">Address Details:
                <small>
                    <sup class="form_color_red">*</sup>
                </small></p>
            <input id="snippet-address" type="text" name="address" placeholder="Address" autocomplete="off" class=""  required
                  />
            <small id="form-address-error-text-id" class="snippet-error" class="form_color_red d-none">
                Required
            </small>

            <p  id="address-details-id">Phone Number:
                <small>
                    <sup class="form_color_red d-none">*</sup>
                </small></p>
            <input id="snippet-phone" type="text" name="address" placeholder="Phone Number" required autocomplete="off"
                />
            <small id="form-phone-error-text-id" class="snippet-error" class="form_color_red d-none">
                Required
            </small>

            <button id="snippet-button" type="submit">Send Quote</button>

        </form>
