version: 1
applications:
  - appRoot: landing
    frontend:
      phases:
        preBuild:
          commands:
            # Vite 7 requires Node >= 20.19 — set Amplify build image Node to 20.x
            - node -v
            - npm ci --legacy-peer-deps
            - npx playwright install chromium
        build:
          commands:
            # Requires Amplify env: VITE_SITE_URL
            # Analytics: VITE_POSTHOG_KEY, VITE_POSTHOG_HOST (PostHog is off when the key is unset)
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .npm/**/*
